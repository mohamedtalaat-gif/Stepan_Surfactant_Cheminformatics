name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --extra dev

      - name: Tests
        run: uv run pytest

      - name: Check the marimo notebooks
        run: uv run marimo check notebooks/*.py
        shell: bash

  # The launchers a person double-clicks, run the way they run on a computer: first start (download and install), page answers, stop.
  launcher-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start with the Windows script
        shell: powershell
        env:
          LAB_NO_BROWSER: "1"
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File windows\start.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $port = (Get-Content .lab.port -TotalCount 1)
          foreach ($page in @("", "lab_molecules/", "s1_aos_economics/")) {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/$page" -UseBasicParsing -TimeoutSec 60
            Write-Host "$page -> $($r.StatusCode)"
            if ($r.StatusCode -ne 200) { exit 1 }
          }

      - name: Stop with the Windows script
        shell: powershell
        run: |
          $labPid = [int](Get-Content .lab.pid -TotalCount 1)
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File windows\stop.ps1
          Start-Sleep -Seconds 3
          if (Get-Process -Id $labPid -ErrorAction SilentlyContinue) { Write-Host "the server is still running"; exit 1 }
          if (Test-Path .lab.pid) { Write-Host "the pid file is still there"; exit 1 }

  launcher-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start with the shell script
        env:
          LAB_NO_BROWSER: "1"
        run: |
          sh scripts/start.sh
          port=$(cat .lab.port)
          for page in "" lab_molecules/ s1_aos_economics/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$port/$page")
            echo "$page -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Stop
        run: |
          pid=$(cat .lab.pid)
          sh scripts/stop.sh
          sleep 2
          if kill -0 "$pid" 2>/dev/null; then echo "the server is still running"; exit 1; fi
